# Release pipeline. Runs when a v* tag is pushed (or by hand from the Actions
# tab for an existing tag) and produces everything a release needs:
#
#   1. A draft GitHub Release whose notes are the tag's section of CHANGELOG.md.
#   2. Desktop installers: Linux (deb, rpm, AppImage), Windows (msi, nsis exe),
#      macOS (dmg for Apple Silicon and Intel).
#   3. Docker images for the backend and frontend, if the Docker Hub secrets
#      are configured.
#
# The Android APK is not built here: scripts/release.sh builds it locally with
# the signing key on this machine and uploads it to the same draft release.
#
# The release stays a draft so the notes and assets can be checked before it
# goes public. scripts/release.sh drives the whole thing from a terminal.
#
# Every build job runs in the "release" environment. Configure that environment
# (Settings > Environments) with yourself as a required reviewer: the jobs then
# wait for your approval in the Actions UI, so nobody else can produce release
# assets or reach the secrets, even with write access. Keep the secrets below
# as environment secrets (on that page), not repository secrets, so they only
# exist inside approved runs.
#
# Secrets (optional):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN push the images (job is skipped without them)
#
# The macOS dmg is unsigned (see RELEASING.md).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.2)'
        required: true
        type: string
      platforms:
        description: 'Comma-separated subset of linux,windows,macos,docker to build'
        required: false
        default: 'linux,windows,macos,docker'
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  DOCKER_NAMESPACE: seojoonleedev

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      desktop: ${{ steps.plan.outputs.desktop }}
      docker: ${{ steps.plan.outputs.docker }}
    steps:
      # Which platforms to build. A tag push builds everything; a manual run can
      # name a subset, which scripts/release.sh uses to fill in only what a
      # draft release is missing.
      - name: Plan the builds
        id: plan
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux,windows,macos,docker' }}
        run: |
          MATRIX=$(jq -c --arg p ",$PLATFORMS," '{include: [.[] | select(.key as $k | $p | contains("," + $k + ","))]}' <<'JSON'
          [
            {"key": "linux",   "name": "Linux x64",           "os": "ubuntu-22.04",   "args": "--bundles deb rpm appimage"},
            {"key": "windows", "name": "Windows x64",         "os": "windows-latest", "args": "--bundles msi nsis"},
            {"key": "macos",   "name": "macOS Apple Silicon", "os": "macos-latest",   "args": "--target aarch64-apple-darwin --bundles dmg", "rust_target": "aarch64-apple-darwin"},
            {"key": "macos",   "name": "macOS Intel",         "os": "macos-latest",   "args": "--target x86_64-apple-darwin --bundles dmg",  "rust_target": "x86_64-apple-darwin"}
          ]
          JSON
          )
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "desktop=$([ "$(jq '.include | length' <<< "$MATRIX")" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "docker=$([[ ",$PLATFORMS," == *,docker,* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "building: $PLATFORMS"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the app version
        id: version
        run: |
          VERSION="${TAG#v}"
          CONF=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          if [ "$CONF" != "$VERSION" ]; then
            echo "::error::tag is $TAG but tauri.conf.json says $CONF. Bump the version first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="v$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## v$VERSION' section."
            exit 1
          fi
          cat notes.md

      - name: Create (or reuse) the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Match by tag or by name: a draft can lose its tag between runs, in
          # which case the API reports it as "untagged-...".
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                 -q ".[] | select(.tag_name == \"$TAG\" or (.draft and .name == \"$TAG\")) | .id" | head -n1)
          if [ -z "$ID" ]; then
            ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                   -f tag_name="$TAG" -f name="$TAG" \
                   -F draft=true -F body=@notes.md -q .id)
            echo "Created draft release $ID"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
              -f tag_name="$TAG" -F body=@notes.md > /dev/null
            echo "Reusing release $ID (tag and notes refreshed)"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: create-release
    if: needs.create-release.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.create-release.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No APPLE_* variables here: the macOS build is unsigned. Passing an
          # unset secret sets the variable to "", and Tauri then tries to import
          # an empty certificate and fails the bundle step.
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  docker:
    name: Docker images
    needs: create-release
    if: needs.create-release.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check for Docker Hub secrets
        id: creds
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set; skipping the Docker images."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.present == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.creds.outputs.present == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the backend image
        if: steps.creds.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/graphwrite-backend:latest
            ${{ env.DOCKER_NAMESPACE }}/graphwrite-backend:${{ needs.create-release.outputs.version }}

      - name: Build and push the frontend image
        if: steps.creds.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/graphwrite-frontend:latest
            ${{ env.DOCKER_NAMESPACE }}/graphwrite-frontend:${{ needs.create-release.outputs.version }}
